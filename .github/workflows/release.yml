name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '特殊情况：Actions runner 不可用时跳过测试；测试失败不能用此项绕过'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pickthought-release
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: 安装 LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: 运行测试
        run: luajit tests/run.lua

      - name: 编译全部 Lua 文件
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luajit -b "$file" /tmp/pickthought-lua-check.luac
          done < <(find pickthought.koplugin -type f -name '*.lua' -print0)

      - name: 检查补丁格式
        run: git diff --check

  release:
    needs: test
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (needs.test.result == 'success' || inputs.skip_tests == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 从 tag 读取版本号
        id: ver
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "version=$tag_ver" >> "$GITHUB_OUTPUT"

      - name: 按主线提交生成去重更新摘要
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只读取主线第一父提交，避免合并分支的同一改动重复进入摘要。
          current_tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then prev="HEAD~20"; fi
          python3 - "$prev" "$current_tag" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import unicodedata

          prev, current = sys.argv[1:3]
          repository = os.environ["GITHUB_REPOSITORY"]
          output_path = os.environ["GITHUB_OUTPUT"]

          raw = subprocess.check_output([
              "git", "log", "--first-parent", "--format=%H%x09%s",
              f"{prev}..{current}",
          ], text=True, encoding="utf-8")

          # 历史提交已经进入主线，保留中文显示；之后的新提交应直接使用中文描述。
          translations = {
              "fix(epub): use correct addPath semantics": "修正 addPath 调用语义",
              "fix(inject): preserve thought text color": "保留想法正文颜色",
              "feat(ui): add runtime annotation style switching": "增加运行时划线样式切换",
              "fix(ui): restore thought popup key pagination": "恢复想法弹窗按键翻页",
              "fix(sync): validate spine cache files and writes": "校验正文缓存文件与写入结果",
              "合并:恢复想法弹窗按键翻页": "恢复想法弹窗按键翻页",
              "合并:运行时划线样式切换": "增加运行时划线样式切换",
          }

          # 不能从 Git 提交关系推断 Issue 的直接关联时，用已确认的项目上下文补齐。
          manual_refs = {
              "合并:恢复想法弹窗按键翻页": {"issues": {16}},
              "合并:运行时划线样式切换": {"issues": {14}},
              "feat(ui): 增加运行时划线样式切换": {"issues": {14}},
              "fix(ui): 限制想法弹窗切换重绘范围": {"issues": {16}},
              "fix: 修复大文件磁盘中转误报失败": {"prs": {10}},
              "fix(epub): use correct addPath semantics": {"prs": {10}},
              "perf(epub): EPUB 大文件磁盘中转": {"prs": {10}},
              "fix(inject): preserve thought text color": {"prs": {9}},
              "fix(inject): 低内存 HTML/CSS 注入优化": {"prs": {9}},
              "perf(thoughts): SQLite 句柄 LRU 与关书释放": {"prs": {11, 18}},
              "perf(sync): 持久化正文 spine 缓存": {"prs": {12, 19}},
          }

          def gh_json(path):
              return json.loads(subprocess.check_output(
                  ["gh", "api", path], text=True, encoding="utf-8"))

          def clean(text):
              return re.sub(r"\s+", " ", unicodedata.normalize("NFKC", text)).strip()

          manual_refs = {clean(subject): refs for subject, refs in manual_refs.items()}

          description_refs = {
              "恢复想法弹窗按键翻页": {"issues": {16}},
              "增加运行时划线样式切换": {"issues": {14}},
              "限制想法弹窗切换重绘范围": {"issues": {16}},
              "修复大文件磁盘中转误报失败": {"prs": {10}},
              "修正 addPath 调用语义": {"prs": {10}},
              "EPUB 大文件磁盘中转": {"prs": {10}},
              "保留想法正文颜色": {"prs": {9}},
              "低内存 HTML/CSS 注入优化": {"prs": {9}},
              "SQLite 句柄 LRU 与关书释放": {"prs": {11, 18}},
              "持久化正文 spine 缓存": {"prs": {12, 19}},
          }

          def dedupe_key(text):
              # 合并标题“运行时划线样式”和功能标题“增加运行时划线样式”视为同一项。
              return re.sub(r"^(增加|新增)\s*", "", clean(text)).casefold()

          def parse_subject(subject):
              subject = clean(subject)
              match = re.match(r"^(perf|feat|fix|style)(?:\([^)]*\))?:\s*(.*)$", subject, re.I)
              if match:
                  kind = match.group(1).lower()
                  description = translations.get(subject, clean(match.group(2)))
                  return kind, description
              if subject.startswith("合并:"):
                  description = translations.get(subject, clean(subject.split(":", 1)[1]))
                  return "feat", description
              return None, None

          categories = {
              "perf": "性能优化：",
              "feat": "新功能：",
              "fix": "问题修复：",
              "style": "样式优化：",
          }
          entries = {kind: [] for kind in categories}
          seen = set()
          contributors = set()

          for row in raw.splitlines():
              if "\t" not in row:
                  continue
              sha, subject = row.split("\t", 1)
              kind, description = parse_subject(subject)
              if not kind:
                  continue

              # 发版摘要不得出现未翻译的纯英语条目，避免漏网提交再次污染 Release。
              if not re.search(r"[\u3400-\u9fff]", description):
                  raise SystemExit(f"发现未翻译的发布提交，请先改为中文：{subject}")

              key = (kind, dedupe_key(description))
              if key in seen:
                  continue
              seen.add(key)

              manual = {
                  "prs": set(manual_refs.get(subject, {}).get("prs", set())),
                  "issues": set(manual_refs.get(subject, {}).get("issues", set())),
              }
              for ref_kind in ("prs", "issues"):
                  manual[ref_kind].update(description_refs.get(description, {}).get(ref_kind, set()))
              prs = set(manual["prs"])
              issues = set(manual["issues"])
              commit_data = gh_json(f"repos/{repository}/commits/{sha}")
              commit_author = (commit_data.get("author") or {}).get("login")
              if commit_author:
                  contributors.add(commit_author)

              for pr in gh_json(f"repos/{repository}/commits/{sha}/pulls"):
                  number = int(pr["number"])
                  # 手工确认过的关联优先，避免 GitHub 把同一提交在旧 PR 中的出现也算进来。
                  if not manual.get("prs"):
                      prs.add(number)
                  login = (pr.get("user") or {}).get("login")
                  if login:
                      contributors.add(login)
                  body = pr.get("body") or ""
                  if not manual.get("prs"):
                      for ref in re.findall(r"(?i)\bPR\s*#?(\d+)", body):
                          prs.add(int(ref))
                  for ref in re.findall(
                      r"(?i)\b(?:issue|issues|fixes|fixed|closes|closed|resolves|resolved)\s*#(\d+)",
                      body,
                  ):
                      issues.add(int(ref))

              refs = []
              if issues:
                  refs.append("Issue " + "/".join(f"#{n}" for n in sorted(issues)))
              if prs:
                  refs.append("PR " + "/".join(f"#{n}" for n in sorted(prs)))
              if refs:
                  description += "（" + " / ".join(refs) + "）"
              entries[kind].append(description)

          sections = [
              f"{categories[kind]}\n" + "\n".join(entries[kind])
              for kind in categories
              if entries[kind]
          ]
          notes = "\n\n".join(sections) or "版本发布"
          contributor_lines = "\n".join(f"- @{login}" for login in sorted(contributors))
          contributor_lines = contributor_lines or "- 暂无可识别贡献者"

          with open(output_path, "a", encoding="utf-8") as output:
              output.write("notes<<EOF\n" + notes + "\nEOF\n")
              output.write("contributors<<EOF\n" + contributor_lines + "\nEOF\n")
          print(notes)
          print("Contributors:")
          print(contributor_lines)
          PY

      - name: 写入发布包版本并打包
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release-package pickthought.koplugin.zip
          mkdir -p release-package
          cp -a pickthought.koplugin release-package/pickthought.koplugin
          sed -i "s/version = \".*\"/version = \"$VER\"/" release-package/pickthought.koplugin/_meta.lua
          sed -i "s/VERSION = \".*\"/VERSION = \"$VER\"/" release-package/pickthought.koplugin/pickthought/config.lua
          (cd release-package && zip -qr ../pickthought.koplugin.zip pickthought.koplugin)
          rm -rf release-package

      - name: 校验发布包版本
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          meta_ver=$(unzip -p pickthought.koplugin.zip pickthought.koplugin/_meta.lua | sed -n 's/.*version = "\([^"]*\)".*/\1/p')
          config_ver=$(unzip -p pickthought.koplugin.zip pickthought.koplugin/pickthought/config.lua | sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p')
          test "$meta_ver" = "$VER"
          test "$config_ver" = "$VER"
          echo "发布包版本校验通过：_meta.lua=$meta_ver config.lua=$config_ver"

      - name: 自动 bump 版本号到 main
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          git checkout main
          # 写入 _meta.lua 和 config.lua
          sed -i "s/version = \".*\"/version = \"$VER\"/" pickthought.koplugin/_meta.lua
          sed -i "s/VERSION = \".*\"/VERSION = \"$VER\"/" pickthought.koplugin/pickthought/config.lua
          git add pickthought.koplugin/_meta.lua pickthought.koplugin/pickthought/config.lua
          git commit -m "chore(release): bump 版本号到 v$VER" || echo "版本号已是最新"
          git push origin main

      - name: 算校验值
        id: hash
        run: |
          sha=$(sha256sum pickthought.koplugin.zip | awk '{print $1}')
          size=$(wc -c < pickthought.koplugin.zip)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: 生成 update.json 并提交 main
        env:
          VER: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.hash.outputs.sha }}
          SIZE: ${{ steps.hash.outputs.size }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          git pull --rebase origin main
          python3 - << PY
          import json, os
          base = "https://github.com/Mr54233/pickthought.koplugin/releases/download/$TAG/pickthought.koplugin.zip"
          mirrors = [p+base for p in ["https://ghfast.top/","https://gh-proxy.com/","https://ghproxy.net/"]]
          m = {
            "version": "$VER",
            "name": f"撷思 PickThought $VER",
            "package_type": "full",
            "package_url": base,
            "package_urls": [base] + mirrors,
            "size": int("$SIZE"),
            "sha256": "$SHA",
            "notes": os.environ.get("NOTES", "").strip() or f"撷思 PickThought $VER 发布。"
          }
          with open("update.json","w") as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
          PY
          git add update.json
          git commit -m "chore(release): 更新清单 v$VER" || echo "no change to update.json"
          git push origin main

      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 撷思 PickThought ${{ steps.ver.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: pickthought.koplugin.zip
          body: |
            ## 本次更新

            ${{ steps.notes.outputs.notes }}

            ---

            ## Contributors（本次更新的贡献者）

            ${{ steps.notes.outputs.contributors }}

            ---

            ## 安装

            1. 下载 `pickthought.koplugin.zip` 并解压
            2. 把 `pickthought.koplugin` 目录放到 KOReader 插件目录:
               `koreader/plugins/pickthought.koplugin`
            3. 完全重启 KOReader,在「工具」菜单找到「撷思」

            ## 环境要求

            KOReader ≥ v2026.03(需要内建的 `ffi/archiver` 与 `lua-ljsqlite3`)。

            ---

            本插件衍生自 [miuread-koreader](https://github.com/miumiupy98-art/miuread-koreader) 与 [weread.koplugin](https://github.com/finlater/weread.koplugin),基于 AGPL-3.0 许可证发布。

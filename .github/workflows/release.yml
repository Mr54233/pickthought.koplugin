name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '特殊情况：Actions runner 不可用时跳过测试；测试失败不能用此项绕过'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pickthought-release
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: 安装 LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: 运行测试
        run: luajit tests/run.lua

      - name: 编译全部 Lua 文件
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luajit -b "$file" /tmp/pickthought-lua-check.luac
          done < <(find pickthought.koplugin -type f -name '*.lua' -print0)

      - name: 检查补丁格式
        run: git diff --check

  release:
    needs: test
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (needs.test.result == 'success' || inputs.skip_tests == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 打包插件
        run: zip -r pickthought.koplugin.zip pickthought.koplugin

      - name: 从 tag 读取版本号
        id: ver
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "version=$tag_ver" >> "$GITHUB_OUTPUT"

      - name: 自动 bump 版本号到 main
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          git checkout main
          # 写入 _meta.lua 和 config.lua
          sed -i "s/version = \".*\"/version = \"$VER\"/" pickthought.koplugin/_meta.lua
          sed -i "s/VERSION = \".*\"/VERSION = \"$VER\"/" pickthought.koplugin/pickthought/config.lua
          git add pickthought.koplugin/_meta.lua pickthought.koplugin/pickthought/config.lua
          git commit -m "chore(release): bump 版本号到 v$VER" || echo "版本号已是最新"
          git push origin main

      - name: 算校验值
        id: hash
        run: |
          sha=$(sha256sum pickthought.koplugin.zip | awk '{print $1}')
          size=$(wc -c < pickthought.koplugin.zip)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: 按类型分类生成更新摘要
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$prev" ]; then prev="HEAD~20"; fi
          # 按前缀分类，过滤掉 chore/docs/refactor/release 等内部提交
          all_commits=$(git log --pretty=format:"%s" "$prev"..HEAD 2>/dev/null || echo "")
          perf=$(echo "$all_commits" | grep -iE '^perf' | sed 's/^[^:]*: /- /' || true)
          feat=$(echo "$all_commits" | grep -iE '^feat' | sed 's/^[^:]*: /- /' || true)
          fix=$(echo "$all_commits" | grep -iE '^fix' | sed 's/^[^:]*: /- /' || true)
          
          notes=""
          if [ -n "$perf" ]; then
            notes="**⚡ 性能优化**"$'\n\n'"$perf"$'\n\n'
          fi
          if [ -n "$feat" ]; then
            notes="${notes}**新功能**"$'\n\n'"$feat"$'\n\n'
          fi
          if [ -n "$fix" ]; then
            notes="${notes}**问题修复**"$'\n\n'"$fix"$'\n\n'
          fi
          # 去掉末尾多余换行
          notes=$(echo "$notes" | sed '/^$/N;/^\n$/D')
          if [ -z "$notes" ]; then notes="版本发布"; fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 生成 update.json 并提交 main
        env:
          VER: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.hash.outputs.sha }}
          SIZE: ${{ steps.hash.outputs.size }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          git pull --rebase origin main
          python3 - << PY
          import json, os
          base = "https://github.com/Mr54233/pickthought.koplugin/releases/download/$TAG/pickthought.koplugin.zip"
          mirrors = [p+base for p in ["https://ghfast.top/","https://gh-proxy.com/","https://ghproxy.net/"]]
          m = {
            "version": "$VER",
            "name": f"撷思 PickThought $VER",
            "package_type": "full",
            "package_url": base,
            "package_urls": [base] + mirrors,
            "size": int("$SIZE"),
            "sha256": "$SHA",
            "notes": os.environ.get("NOTES", "").strip() or f"撷思 PickThought $VER 发布。"
          }
          with open("update.json","w") as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
          PY
          git add update.json
          git commit -m "chore(release): 更新清单 v$VER" || echo "no change to update.json"
          git push origin main

      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 撷思 PickThought ${{ steps.ver.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: pickthought.koplugin.zip
          body: |
            ## 本次更新

            ${{ steps.notes.outputs.notes }}

            ---

            ## 安装

            1. 下载 `pickthought.koplugin.zip` 并解压
            2. 把 `pickthought.koplugin` 目录放到 KOReader 插件目录:
               `koreader/plugins/pickthought.koplugin`
            3. 完全重启 KOReader,在「工具」菜单找到「撷思」

            ## 环境要求

            KOReader ≥ v2025.08(需要内建的 `ffi/archiver` 与 `lua-ljsqlite3`)。

            ---

            本插件衍生自 [miuread-koreader](https://github.com/miumiupy98-art/miuread-koreader) 与 [weread.koplugin](https://github.com/finlater/weread.koplugin),基于 AGPL-3.0 许可证发布。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "特殊情况：Actions runner 不可用时跳过测试；测试失败不能用此项绕过"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pickthought-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      skip_tests: ${{ inputs.skip_tests == true }}
    permissions:
      contents: read

  release:
    needs: quality
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (needs.quality.result == 'success' || (needs.quality.result == 'skipped' && inputs.skip_tests == true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 校验 tag 和主线一致
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#v}"
          python3 - "$tag_ver" <<'PY'
          import re
          import sys
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", sys.argv[1]):
              raise SystemExit(f"tag 不是有效的 SemVer：{sys.argv[1]}")
          PY
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "version=$tag_ver" >> "$GITHUB_OUTPUT"

      - name: 下载质量检查生成的测试包
        if: ${{ needs.quality.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pickthought-package
          path: release-artifact

      - name: 准备并校验正式包
        id: package
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/pickthought.koplugin.zip"
          if [ -f release-artifact/pickthought.koplugin.zip ]; then
            cp release-artifact/pickthought.koplugin.zip "$package"
          else
            python3 tools/build_package.py \
              --source . \
              --version "$VER" \
              --output "$package"
          fi
          python3 tools/validate_package.py \
            --archive "$package" \
            --version "$VER" \
            --metadata "$RUNNER_TEMP/package.json"
          sha256sum "$package" > "$package.sha256"
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "checksum=$package.sha256" >> "$GITHUB_OUTPUT"

      - name: 校验 update.json 与正式包一致
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          python3 tools/validate_manifest.py \
            --manifest update.json \
            --version "$VER" \
            --package "$PACKAGE"

      - name: 生成中文发布摘要
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            previous="HEAD~20"
          fi
          python3 tools/release_notes.py \
            --previous "$previous" \
            --current "$GITHUB_SHA" \
            --repository "$REPOSITORY" \
            --output release-notes.json

      - name: 校验清单摘要并生成 Release 描述
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VER" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          notes = json.loads(Path("release-notes.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("update.json").read_text(encoding="utf-8"))
          if manifest["notes"].strip() != notes["notes"].strip():
              raise SystemExit("update.json.notes 与本次生成的发布摘要不一致，请重新运行 prepare_release.py")

          body = f"""## 本次更新

          {notes["notes"]}

          ---

          ## Contributors（本次更新的贡献者）

          {notes["contributors_text"]}

          ---

          ## 安装

          1. 下载 `pickthought.koplugin.zip` 并解压
          2. 把 `pickthought.koplugin` 目录放到 KOReader 插件目录：
             `koreader/plugins/pickthought.koplugin`
          3. 完全重启 KOReader，在「工具」菜单找到「撷思」

          ## 环境要求

          KOReader ≥ v2026.03（需要内建的 `ffi/archiver` 与 `lua-ljsqlite3`）。

          ---

          本插件衍生自 [miuread-koreader](https://github.com/miumiupy98-art/miuread-koreader) 与 [weread.koplugin](https://github.com/finlater/weread.koplugin)，基于 AGPL-3.0 许可证发布。
          """
          # The indented heredoc above keeps the workflow readable; release text should not inherit it.
          body = "\n".join(line.strip() for line in body.splitlines()) + "\n"
          Path("release-body.md").write_text(body, encoding="utf-8")
          PY

      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 撷思 PickThought ${{ steps.version.outputs.version }}
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.checksum }}
          fail_on_unmatched_files: true
